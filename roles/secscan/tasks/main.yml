---
# ======================================================================
# Role secscan - Quét bảo mật (không cần Python, có stdout logging)
# ======================================================================

- name: Set results path
  set_fact:
    results_path: "/tmp/secscan_results_{{ inventory_hostname }}"

- name: Create results directory
  raw: mkdir -p {{ results_path }}
  changed_when: false
  ignore_errors: yes

- name: 1. PATCHES & KERNEL
  raw: |
    {
      echo "=== OS ==="
      lsb_release -ds 2>/dev/null || grep PRETTY_NAME /etc/os-release | cut -d'"' -f2
      echo "=== Kernel ==="
      uname -r
      echo "=== Updates chưa cài ==="
      apt-get -s upgrade 2>/dev/null | grep -E '^Inst ' | head -5
    } | tee {{ results_path }}/1_patches.txt
  register: task1
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task1.stdout_lines }}"

- name: 2. ACCOUNTS
  raw: |
    {
      echo "=== UID 0 (ngoài root) ==="
      awk -F: '$3 == 0 && $1 != "root" {print}' /etc/passwd || echo "OK"
      echo "=== Shell users ==="
      grep -v '/nologin' /etc/passwd | cut -d: -f1,3,7 | head -10 || echo "OK"
    } | tee {{ results_path }}/2_accounts.txt
  register: task2
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task2.stdout_lines }}"

- name: 3. SSH CONFIG
  raw: |
    {
      echo "=== SSH keys ==="
      for f in /root/.ssh/authorized_keys /home/*/.ssh/authorized_keys; do
        [ -f "$f" ] && { echo "-- $f --"; wc -l < "$f"; }
      done || echo "OK"
    } | tee {{ results_path }}/3_ssh.txt
  register: task3
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task3.stdout_lines }}"

- name: 4. SUDO
  raw: |
    {
      echo "=== NOPASSWD ==="
      grep 'NOPASSWD' /etc/sudoers /etc/sudoers.d/* 2>/dev/null || echo "OK"
    } | tee {{ results_path }}/4_sudo.txt
  register: task4
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task4.stdout_lines }}"

- name: 5. FIREWALL
  raw: |
    {
      echo "=== UFW ==="
      ufw status 2>/dev/null || echo "UFW không bật"
      echo "=== Ports ==="
      ss -tlnp 2>/dev/null | wc -l || echo "OK"
    } | tee {{ results_path }}/5_firewall.txt
  register: task5
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task5.stdout_lines }}"

- name: 6. CRON
  raw: |
    {
      echo "=== Cron lạ ==="
      grep -E 'curl|wget|nc' /etc/crontab /etc/cron.d/* 2>/dev/null || echo "OK"
    } | tee {{ results_path }}/6_cron.txt
  register: task6
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task6.stdout_lines }}"

- name: 7. PROCESS
  raw: |
    {
      echo "=== Process lạ ==="
      for p in /proc/[0-9]*; do
        e=$(readlink "$p/exe" 2>/dev/null) || continue
        case "$e" in /tmp/*|/dev/shm/*) echo "PID ${p#/proc/}: $e";; esac
      done || echo "OK"
    } | tee {{ results_path }}/7_process.txt
  register: task7
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task7.stdout_lines }}"

- name: 8. FILES (Hidden, SUID)
  raw: |
    {
      echo "=== SUID ==="
      find / -xdev -type f -perm -04000 2>/dev/null | wc -l || echo "0"
      echo "=== File ẩn ==="
      find /etc /usr/bin -maxdepth 2 -name '.*' -type f 2>/dev/null | wc -l || echo "0"
    } | tee {{ results_path }}/8_files.txt
  register: task8
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task8.stdout_lines }}"

- name: 9. CHANGED FILES (7 days)
  raw: |
    {
      echo "=== /etc (7 ngày) ==="
      find /etc -type f -mtime -7 2>/dev/null | wc -l || echo "0"
      echo "=== /root, /home ==="
      find /root /home -type f -mtime -7 2>/dev/null | wc -l || echo "0"
    } | tee {{ results_path }}/9_changed_files.txt
  register: task9
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task9.stdout_lines }}"

- name: 10. AUTH LOGS
  raw: |
    {
      echo "=== Root login ==="
      grep 'Accepted.*root' /var/log/auth.log 2>/dev/null | wc -l || echo "0"
      echo "=== Brute-force ==="
      grep 'Failed password' /var/log/auth.log* 2>/dev/null | wc -l || echo "0"
    } | tee {{ results_path }}/10_auth.txt
  register: task10
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task10.stdout_lines }}"

- name: 11. BASH HISTORY
  raw: |
    {
      echo "=== Lệnh lạ (curl, wget, nc) ==="
      grep -c -E 'curl |wget |nc |python.*-c' /root/.bash_history 2>/dev/null || echo "0"
    } | tee {{ results_path }}/11_bash_history.txt
  register: task11
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task11.stdout_lines }}"

- name: 12. PERSISTENCE (Backdoor)
  raw: |
    {
      echo "=== Suspicious .bashrc ==="
      grep -c -E 'alias|export|eval' /root/.bashrc 2>/dev/null || echo "0"
      echo "=== /etc/ld.so.preload ==="
      [ -f /etc/ld.so.preload ] && echo "EXISTS" || echo "OK"
    } | tee {{ results_path }}/12_persistence.txt
  register: task12
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task12.stdout_lines }}"

- name: 13. KNOWN_HOSTS
  raw: |
    {
      echo "=== SSH remote (known_hosts) ==="
      wc -l /root/.ssh/known_hosts 2>/dev/null || echo "0"
    } | tee {{ results_path }}/13_known_hosts.txt
  register: task13
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task13.stdout_lines }}"

- name: 14. KERNEL MODULES
  raw: |
    {
      echo "=== Loaded modules ==="
      lsmod | wc -l || echo "0"
    } | tee {{ results_path }}/14_kernel.txt
  register: task14
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task14.stdout_lines }}"

- name: 15. /etc/hosts & DNS
  raw: |
    {
      echo "=== /etc/hosts ==="
      grep -c -v '^\s*#' /etc/hosts 2>/dev/null || echo "0"
      echo "=== DNS ==="
      cat /etc/resolv.conf | head -3
    } | tee {{ results_path }}/15_hosts.txt
  register: task15
  changed_when: false
  ignore_errors: yes

- debug: msg="{{ task15.stdout_lines }}"

- name: Summary
  debug:
    msg: |
      ✅ Quét hoàn thành: {{ inventory_hostname }}
      📁 Kết quả: {{ results_path }}
