---
# ======================================================================
# scan.yml - Playbook chính: chạy quét HCI bằng Ansible roles
# Chạy: ansible-playbook scan.yml -i inventory/hosts.ini
# Không cần Python (chỉ shell commands)
# ======================================================================

- name: HCI Security Scan
  hosts: hci
  gather_facts: no
  roles:
    - secscan

  post_tasks:
    - name: Fetch results về controller
      synchronize:
        src: "/tmp/secscan_results_{{ inventory_hostname }}/"
        dest: "{{ playbook_dir }}/results/{{ inventory_hostname }}/"
        mode: pull
        delete: no
        archive: yes
      ignore_errors: yes

    - name: Dọn dẹp thư mục tạm
      file:
        path: "/tmp/secscan_results_{{ inventory_hostname }}"
        state: absent
      ignore_errors: yes

# Tổng hợp kết quả trên controller
- name: Summary
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Tạo thư mục kết quả
      file:
        path: "{{ playbook_dir }}/results"
        state: directory

    - name: Liệt kê kết quả
      shell: |
        echo "=============== HCI SCAN RESULTS ==============="
        find {{ playbook_dir }}/results -type f -name "*.txt" | head -50
        echo ""
        echo "📁 Kết quả lưu ở: {{ playbook_dir }}/results"
        echo "📦 Để tar: tar -czf hci_scan_$(date +%Y%m%d_%H%M%S).tar.gz {{ playbook_dir }}/results"
      register: summary
      changed_when: false

    - name: Hiển thị tóm tắt
      debug:
        msg: "{{ summary.stdout_lines }}"
